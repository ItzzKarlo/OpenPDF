[package]
name = "openpdf"
version = "0.1.0"
description = "A free, offline-first PDF editor"
authors = ["OpenPDF contributors"]
license = "MIT"
repository = "https://github.com/openpdf-editor/openpdf"
edition = "2021"
rust-version = "1.90"

[lib]
name = "openpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
